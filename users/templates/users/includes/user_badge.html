<div class="user-badge">
    {% if user.avatar %}
        <img src="{{ user.avatar.url }}" class="avatar avatar-sm" alt="{{ user.username }}">
    {% else %}
        <div class="empty-avatar empty-avatar-sm">
            <span>{{ user.username|make_list|first|upper }}</span>
        </div>
    {% endif %}
    <a href="{% url 'users:profile' user.username %}">{{ user.username }}</a>
</div>

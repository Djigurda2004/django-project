services:
  db:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT_EXTERNAL}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  redis:
    image: redis:8.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  worker:
    build: .
    command: celery -A project worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    env_file:
      - .env
  
  celery_beat:
    build: .
    command: celery -A project beat --loglevel=info --pidfile=/tmp/celerybeat.pid --schedule=/var/lib/celerybeat/celerybeat-schedule
    volumes:
      - .:/app
      - celery_beat_data:/var/lib/celerybeat
    depends_on:
      - worker
      - redis


volumes:
  postgres_data:
  redis_data:
  celery_beat_data: